aid: betterorigin
name: Better Origin
description: >-
  Better Origin is a UK-based agritech company decarbonizing the food chain by
  converting food waste into sustainable, locally produced animal feed. Its core
  technology is a fully automated, AI-controlled containerized insect farm that
  breeds black soldier fly larvae to consume food waste and produce nutrient-rich
  insect-based ingredients for pet food, poultry feed, and aquaculture. The
  systems are remotely monitored and controlled by software and require no
  specialist knowledge from operators. Better Origin is a portfolio company of
  Balderton Capital and was added to the API Evangelist network as a company
  profile; it does not currently publish a public API, developer portal, or
  technical documentation.
